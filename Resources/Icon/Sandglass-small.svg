<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sandglass app icon: small-size variant, used for the 16, 32 and 64 px
  renditions (see Scripts/make-icon.py).

  The same tile, palette and hourglass as Sandglass.svg, redrawn so the object
  survives at a dozen pixels:
    - the hourglass is a little larger (10 % up) and cut back to its strongest
      reading: a solid ink silhouette instead of a clear outline, so the shape
      never thins out into a hairline;
    - the sand is a settled band with a crowned crest, in the same amber;
    - one soft highlight down the left wall keeps it feeling like glass;
    - no rims, streaks, wall-shade, thread or contact shadow, all of which only
      smear at this scale.

  Coordinates are identical to Sandglass.svg; the size comes from the transform.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Sandglass (small)</title>
  <defs>
    <!-- Tile: identical to Sandglass.svg (824 x 824 at 100,100, r = 185.4). -->
    <path id="tile-shape" d="
      M383.41,100
      L640.59,100 C722.19,100 763,100 799.79,112.14 L806.92,113.89 C854.88,131.34 892.66,169.12 910.11,217.08 L911.86,224.21 C924,261 924,301.81 924,383.41
      L924,640.59 C924,722.19 924,763 911.86,799.79 L910.11,806.92 C892.66,854.88 854.88,892.66 806.92,910.11 L799.79,911.86 C763,924 722.19,924 640.59,924
      L383.41,924 C301.81,924 261,924 224.21,911.86 L217.08,910.11 C169.12,892.66 131.34,854.88 113.89,806.92 L112.14,799.79 C100,763 100,722.19 100,640.59
      L100,383.41 C100,301.81 100,261 112.14,224.21 L113.89,217.08 C131.34,169.12 169.12,131.34 217.08,113.89 L224.21,112.14 C261,100 301.81,100 383.41,100
      Z"/>
    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>

    <!-- The same one-piece glass as Sandglass.svg. -->
    <path id="glass" d="
      M368,257
      L656,257
      C669.3,257 680,267.7 680,281
      C680,312 678,346 671,377
      C656,440 555,471 523,512
      C555,553 656,584 671,647
      C678,678 680,712 680,743
      C680,756.3 669.3,767 656,767
      L368,767
      C354.7,767 344,756.3 344,743
      C344,712 346,678 353,647
      C368,584 469,553 501,512
      C469,471 368,440 353,377
      C346,346 344,312 344,281
      C344,267.7 354.7,257 368,257
      Z"/>
    <clipPath id="glass-clip"><use href="#glass"/></clipPath>

    <linearGradient id="tile-base" gradientUnits="userSpaceOnUse" x1="300" y1="100" x2="720" y2="924">
      <stop offset="0" stop-color="#FBFBFD"/>
      <stop offset="0.55" stop-color="#EDEEF2"/>
      <stop offset="1" stop-color="#DFE2E8"/>
    </linearGradient>
    <radialGradient id="tile-sheen" gradientUnits="userSpaceOnUse" cx="430" cy="190" r="640">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Solid ink, cool at the top and a touch warmer at the base. -->
    <linearGradient id="glass-solid" gradientUnits="userSpaceOnUse" x1="0" y1="257" x2="0" y2="767">
      <stop offset="0" stop-color="#485164"/>
      <stop offset="0.55" stop-color="#343B4A"/>
      <stop offset="1" stop-color="#282C35"/>
    </linearGradient>
    <!-- Sand: the same amber as the large icon. -->
    <linearGradient id="sand-fill" gradientUnits="userSpaceOnUse" x1="0" y1="700" x2="0" y2="780">
      <stop offset="0" stop-color="#F2C079"/>
      <stop offset="0.5" stop-color="#DEA451"/>
      <stop offset="1" stop-color="#C0812F"/>
    </linearGradient>
    <!-- A soft highlight down the lit left wall. -->
    <linearGradient id="wall-light" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="470" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="tile-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
    <filter id="blur-8" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <use href="#tile-shape" fill="#000" filter="url(#tile-shadow)"/>
  <g clip-path="url(#tile-clip)">
    <use href="#tile-shape" fill="url(#tile-base)"/>
    <use href="#tile-shape" fill="url(#tile-sheen)"/>
  </g>

  <g transform="translate(512 512) scale(1.1) translate(-512 -512)">
    <!-- The glass reads as a solid shape at this size. -->
    <use href="#glass" fill="url(#glass-solid)"/>

    <g clip-path="url(#glass-clip)">
      <!-- Settled sand, crowned at the centre. -->
      <path d="M330,744 C420,738 480,716 512,712 C544,716 604,738 694,744 L694,790 L330,790 Z" fill="url(#sand-fill)"/>
      <!-- Glass, not stone: one soft light down the left wall. -->
      <path d="M352,296 L404,296 L404,520 C404,556 380,586 352,610 Z" fill="url(#wall-light)" filter="url(#blur-8)"/>
      <path d="M352,590 C376,612 396,640 400,676 L400,760 L352,760 Z" fill="url(#wall-light)" opacity="0.5" filter="url(#blur-8)"/>
    </g>
  </g>
</svg>
