<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sandglass app icon: design source of truth.

  Canvas  1024 x 1024, transparent outside the tile.
  Tile    macOS icon grid: an 824 x 824 rounded square at (100,100) with
          continuous-curvature ("squircle") corners, r = 185.4, plus the
          standard soft drop shadow inside the margin (y +12, blur 24, 30 % black).
          Painted as warm porcelain: near-white at the top-left, cooling to a
          pale blue-grey at the base, with a faint cool pool of light where the
          hourglass stands.
  Hero    A single piece of blown glass, ~62 % of the tile height. The
          silhouette is one continuous line: a rounded lip (r = 24), a wall
          that falls and swells round the shoulder, then one long sweep into
          an 18-unit waist, mirrored below. The body is near-clear — a whisper
          of milk at the walls, open in the middle — so the tile shows through.
          Thickness is drawn, not shaded: a bright rim along the inner left
          wall, a cool wall-shade on the right, one soft window reflection per
          bulb, and a glint pinched at the waist. No metal caps, no frame.
  Sand    Only what is needed to read the object: a hairline thread falling
          from the neck and a thin settled layer with a gently crowned crest.
  Light   Key light from the top-left. The shadow is a low contact shadow
          under the base only; a cast shadow showing through the glass would
          grey it.

  The 16, 32 and 64 px renditions come from Sandglass-small.svg, a bolder
  simplification of this drawing. Regenerate Resources/Sandglass.icns with:
      python3 Scripts/make-icon.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Sandglass</title>
  <defs>
    <!-- ================================================================== -->
    <!-- Geometry                                                           -->
    <!-- ================================================================== -->

    <!-- Tile: Apple's continuous-corner construction (curve, line, near-circular
         arc, line, curve), mirrored about each corner diagonal; the curvature
         starts 1.528 r = 283.4 px from each corner. -->
    <path id="tile-shape" d="
      M383.41,100
      L640.59,100 C722.19,100 763,100 799.79,112.14 L806.92,113.89 C854.88,131.34 892.66,169.12 910.11,217.08 L911.86,224.21 C924,261 924,301.81 924,383.41
      L924,640.59 C924,722.19 924,763 911.86,799.79 L910.11,806.92 C892.66,854.88 854.88,892.66 806.92,910.11 L799.79,911.86 C763,924 722.19,924 640.59,924
      L383.41,924 C301.81,924 261,924 224.21,911.86 L217.08,910.11 C169.12,892.66 131.34,854.88 113.89,806.92 L112.14,799.79 C100,763 100,722.19 100,640.59
      L100,383.41 C100,301.81 100,261 112.14,224.21 L113.89,217.08 C131.34,169.12 169.12,131.34 217.08,113.89 L224.21,112.14 C261,100 301.81,100 383.41,100
      Z"/>
    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>

    <!-- The glass: one closed path, symmetric about x = 512 and y = 512.
         Lip at y 257 / 767 from x 368 to 656, rounded with r = 24; the wall
         falls, swells round the shoulder and sweeps into an 18-unit waist. -->
    <path id="glass" d="
      M368,257
      L656,257
      C669.3,257 680,267.7 680,281
      C680,312 678,346 671,377
      C656,440 555,471 523,512
      C555,553 656,584 671,647
      C678,678 680,712 680,743
      C680,756.3 669.3,767 656,767
      L368,767
      C354.7,767 344,756.3 344,743
      C344,712 346,678 353,647
      C368,584 469,553 501,512
      C469,471 368,440 353,377
      C346,346 344,312 344,281
      C344,267.7 354.7,257 368,257
      Z"/>
    <clipPath id="glass-clip"><use href="#glass"/></clipPath>

    <!-- ================================================================== -->
    <!-- Paint: tile                                                        -->
    <!-- ================================================================== -->

    <!-- Porcelain: warm white overhead, cooling towards the base. -->
    <linearGradient id="tile-base" gradientUnits="userSpaceOnUse" x1="300" y1="100" x2="720" y2="924">
      <stop offset="0" stop-color="#FBFBFD"/>
      <stop offset="0.55" stop-color="#EDEEF2"/>
      <stop offset="1" stop-color="#DFE2E8"/>
    </linearGradient>
    <!-- Soft overhead light. -->
    <radialGradient id="tile-sheen" gradientUnits="userSpaceOnUse" cx="430" cy="190" r="640">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- The cool pool of light the hourglass stands in. -->
    <radialGradient id="tile-pool" gradientUnits="userSpaceOnUse" cx="512" cy="540" r="340">
      <stop offset="0" stop-color="#AEBBD6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#CBD6E6" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner edge light: bright along the top edge, a whisper elsewhere. -->
    <linearGradient id="tile-rim" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6F7889" stop-opacity="0.15"/>
    </linearGradient>

    <!-- ================================================================== -->
    <!-- Paint: glass                                                       -->
    <!-- ================================================================== -->

    <!-- Near-clear body: a whisper of milk at the walls, open in the middle. -->
    <linearGradient id="glass-body" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.16" stop-color="#F7FAFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#EFF4FC" stop-opacity="0.00"/>
      <stop offset="0.84" stop-color="#E6EEFA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D5E2F4" stop-opacity="0.30"/>
    </linearGradient>
    <!-- Refraction: cool along the lit left wall, warm-shadowed on the right. -->
    <linearGradient id="glass-refract" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#B7CCE7" stop-opacity="0.22"/>
      <stop offset="0.10" stop-color="#D6E2F1" stop-opacity="0.04"/>
      <stop offset="0.74" stop-color="#D6E2F1" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#A2B4CB" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Wall thickness on the shaded right side. -->
    <linearGradient id="wall-shade" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="680" y2="0">
      <stop offset="0.55" stop-color="#8FA3BE" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#8FA3BE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#75899F" stop-opacity="0.34"/>
    </linearGradient>
    <!-- The line the silhouette is drawn with. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="344" y1="257" x2="680" y2="767">
      <stop offset="0" stop-color="#2A2E38" stop-opacity="0.84"/>
      <stop offset="0.5" stop-color="#30353F" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#3E4451" stop-opacity="0.72"/>
    </linearGradient>
    <!-- Light caught along the inner left wall. -->
    <linearGradient id="inner-light" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <!-- One soft window reflection per bulb, down the left wall. -->
    <linearGradient id="streak-upper" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="470">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak-lower" gradientUnits="userSpaceOnUse" x1="0" y1="580" x2="0" y2="745">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- ================================================================== -->
    <!-- Paint: sand                                                        -->
    <!-- ================================================================== -->

    <!-- Settled sand: sunlit at the crest, deepening into the base. -->
    <linearGradient id="sand-layer" gradientUnits="userSpaceOnUse" x1="0" y1="726" x2="0" y2="768">
      <stop offset="0" stop-color="#F4CB8B" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#E0A957" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#BC7C2B" stop-opacity="0.55"/>
    </linearGradient>

    <!-- ================================================================== -->
    <!-- Filters (user-space regions, so blurs never clip at shape bounds)   -->
    <!-- ================================================================== -->

    <filter id="tile-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
    <filter id="blur-14" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur-6" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur-3" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- ==================================================================== -->
  <!-- Tile                                                                 -->
  <!-- ==================================================================== -->

  <use href="#tile-shape" fill="#000" filter="url(#tile-shadow)"/>

  <g clip-path="url(#tile-clip)">
    <use href="#tile-shape" fill="url(#tile-base)"/>
    <use href="#tile-shape" fill="url(#tile-sheen)"/>
    <use href="#tile-shape" fill="url(#tile-pool)"/>
    <!-- 5-unit stroke clipped to the tile = a 2.5-unit inner edge light. -->
    <use href="#tile-shape" fill="none" stroke="url(#tile-rim)" stroke-width="5"/>
  </g>

  <!-- ==================================================================== -->
  <!-- Hourglass                                                            -->
  <!-- ==================================================================== -->

  <!-- A low, soft contact shadow under the base only; a cast shadow showing
       through the glass would grey it. -->
  <ellipse cx="512" cy="776" rx="152" ry="16" fill="#6B6157" opacity="0.16" filter="url(#blur-14)"/>

  <!-- The body of the glass. -->
  <use href="#glass" fill="url(#glass-body)"/>
  <use href="#glass" fill="url(#glass-refract)"/>

  <g clip-path="url(#glass-clip)">
    <!-- Sand, seen through the glass. -->
    <path d="M300,746 C400,740 470,726 512,724 C554,726 624,740 724,746 L724,800 L300,800 Z" fill="url(#sand-layer)"/>
    <path d="M300,746 C400,740 470,726 512,724 C554,726 624,740 724,746" fill="none" stroke="#FFE9C8" stroke-opacity="0.75" stroke-width="1.6"/>
    <path d="M300,754 C400,748 470,734 512,732 C554,734 624,748 724,754" fill="none" stroke="#B87A2A" stroke-opacity="0.18" stroke-width="6" filter="url(#blur-3)"/>
    <!-- The falling thread: warm shadow, bright core. -->
    <line x1="512" y1="514" x2="512" y2="724" stroke="#C98A2C" stroke-width="2.6" opacity="0.38"/>
    <line x1="512" y1="514" x2="512" y2="724" stroke="#FFD79A" stroke-width="1" opacity="0.48"/>

    <!-- One long, soft window reflection per bulb. -->
    <path d="M364,300 C357,332 356,364 360,390 C365,430 392,458 424,480
             C400,450 385,416 384,388 C383,356 388,330 398,304 Z"
          fill="url(#streak-upper)" filter="url(#blur-3)"/>
    <path d="M420,566 C392,592 372,622 366,652 C362,682 364,712 370,742
             C376,712 385,684 394,660 C404,632 424,596 420,566 Z"
          fill="url(#streak-lower)" filter="url(#blur-3)"/>

    <!-- Light caught along the inner wall, then the shaded right wall. -->
    <use href="#glass" fill="none" stroke="url(#inner-light)" stroke-width="13"/>
    <use href="#glass" fill="none" stroke="url(#wall-shade)" stroke-width="26"/>

    <!-- The pinch catches a little light. -->
    <use href="#glass" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4" filter="url(#blur-6)"/>
  </g>

  <!-- The lips: one fine line across each opening, with a rim light above. -->
  <g stroke-linecap="round" fill="none">
    <path d="M368,257 L656,257" stroke="url(#ink)" stroke-width="5.5"/>
    <path d="M368,767 L656,767" stroke="url(#ink)" stroke-width="5.5" opacity="0.9"/>
    <path d="M380,252 L644,252" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M380,772 L644,772" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- The silhouette, drawn last so it stays crisp. -->
  <use href="#glass" fill="none" stroke="url(#ink)" stroke-width="5.5" stroke-linejoin="round"/>
</svg>
